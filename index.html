<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Argostos, prototype: a glass worm swims through the falling sand of Sandopia and hunts the trucks of a mining company."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#86aad2" />
    <title>Argostos · prototype</title>
    <!-- An amber eye, inline: no request for /favicon.ico (a 404 in every console). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffb43b'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff4cc'/%3E%3C/svg%3E"
    />
    <style>
      /* The first paint is this page's own: the desert's colours under the sky, and one line. */
      :root {
        color-scheme: light dark;
        --panel: light-dark(rgb(250 246 239 / 0.88), rgb(13 16 18 / 0.84));
        --ink: light-dark(#1d1812, #f4eee5);
        --edge: light-dark(rgb(84 62 38 / 0.24), rgb(255 255 255 / 0.18));
        --accent: light-dark(#8f5200, #f4b647);
      }
      html {
        cursor: default;
      }
      :where(
        a[href],
        button,
        select,
        summary,
        label[for],
        [role='button'],
        [role='link'],
        input:is([type='checkbox'], [type='radio'], [type='range'])
      ) {
        cursor: pointer;
      }
      :disabled,
      [aria-disabled='true'] {
        cursor: not-allowed;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: linear-gradient(
          #86aad2 0%,
          #cfdde6 17%,
          #efe2c8 28%,
          #d6b47f 28%,
          #b98d59 46%,
          #8a633e 72%,
          #5f432a 100%
        );
        color: var(--ink);
        font:
          1rem/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      ::selection {
        background: color-mix(in srgb, var(--accent) 32%, transparent);
      }
      /* The game is interface: never selected, no long-press menu, no tap flash. */
      /* --side: the art beside the playing frame on a window wider than 2:1 (VIEW.maxAspect in
         src/rules/viewing.ts); the controls stay inside the frame. */
      .game {
        container: game / size;
        --side: max(0px, (100cqw - 200cqh) / 2);
        position: fixed;
        inset: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Only the play area holds still (zoom stays possible everywhere else); the cursor marks
         where the hero heads. */
      .world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      .status {
        position: absolute;
        left: 50%;
        bottom: max(env(safe-area-inset-bottom), 1rem);
        transform: translateX(-50%);
        box-sizing: border-box;
        width: max-content;
        max-width: calc(100% - 2 * var(--side) - 2rem);
        margin: 0;
        padding: 0.625rem 1rem;
        border-radius: 1.25rem;
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--edge);
        text-align: center;
        text-wrap: balance;
      }
      /* The debug readout (?debug=1), under the hunt's top row. */
      .readout {
        position: absolute;
        top: calc(max(env(safe-area-inset-top), 0.75rem) + 7.5rem);
        left: max(env(safe-area-inset-left), calc(var(--side) + 0.75rem));
        box-sizing: border-box;
        max-width: calc(100% - 2 * var(--side) - 5.25rem);
        margin: 0;
        padding: 0.5rem 0.75rem;
        overflow: hidden;
        border-radius: 0.5rem;
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--edge);
        font:
          0.875rem/1.35 ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        white-space: pre-wrap;
        pointer-events: none;
      }
      /* The title screen of the first paint: the game's name, large, over the desert's colours,
         until the first hunt draws (then it stays for screen readers only). Nothing the game
         paints later is larger, so the page's largest paint is this first one. */
      .title {
        position: absolute;
        top: 15%;
        left: 50%;
        margin: 0;
        transform: translate(-50%, -50%);
        /* Over the first paint's sky, the same in both themes: a dark ink in both. */
        color: #2a1a0c;
        font:
          800 clamp(2.75rem, 6vw + 1.5rem, 5.5rem) / 1 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 0.06em 0.3em rgb(255 255 255 / 0.4);
        white-space: nowrap;
      }
      .game:not([data-state='loading']) .title {
        top: auto;
        left: auto;
        transform: none;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      [hidden] {
        display: none !important;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="game" id="game" data-state="loading">
      <h1 class="title">Argostos</h1>
      <canvas
        class="world"
        id="world"
        role="img"
        aria-label="The desert of Sandopia seen in section."
      ></canvas>
      <p class="status" id="status" role="status">Loading the desert…</p>
      <pre class="readout" id="readout" hidden></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
